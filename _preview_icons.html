<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>胶片卷图标预览 · svStudio</title>
<style>
  :root{
    --bg:#0e0e11; --bg-2:#16161a; --border:rgba(255,255,255,.08);
    --border-hi:rgba(255,255,255,.16); --text:#ececf1; --text-dim:#9a9aa5;
    --accent:#22d3ee; --panel-hover:rgba(255,255,255,.07); --curve:cubic-bezier(.22,1,.36,1);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font:14px/1.6 "Microsoft YaHei","PingFang SC",system-ui,sans-serif;padding:26px 30px 60px}
  h1{font-size:17px;font-weight:600;margin:0 0 4px}
  .sub{color:var(--text-dim);font-size:12px;margin-bottom:22px}
  h2{font-size:12px;letter-spacing:1px;color:var(--accent);font-weight:600;
     margin:26px 0 12px;padding-bottom:6px;border-bottom:1px solid var(--border)}
  .pane{width:300px;background:var(--bg-2);border:1px solid var(--border);
        border-radius:12px;padding:14px}
  /* ---- 卷：拟物图标 ---- */
  .g-stocks{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
  .g-stock{display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:7px 3px 5px;border-radius:9px;border:1px solid var(--border);
    background:rgba(255,255,255,.03);cursor:pointer;transition:all .18s var(--curve)}
  .g-stock:hover{background:var(--panel-hover);border-color:var(--border-hi)}
  .g-stock.on{border-color:var(--accent);background:rgba(34,211,238,.10);
    box-shadow:0 0 0 1px rgba(34,211,238,.35) inset}
  .g-stock .fi{display:block;width:40px;height:40px;
    filter:drop-shadow(0 2px 4px rgba(0,0,0,.45));transition:transform .18s var(--curve)}
  .g-stock:hover .fi{transform:translateY(-1px) scale(1.05)}
  .g-stock-name{font-size:9.5px;line-height:1.2;letter-spacing:.2px;
    color:var(--text-dim);text-align:center;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;max-width:100%}
  .g-stock.on .g-stock-name{color:var(--accent)}
  /* ---- 基准 ---- */
  .g-bases{display:flex;flex-direction:column;gap:4px}
  .g-base{display:flex;align-items:center;gap:7px;padding:6px 9px;
    border-radius:7px;border:1px solid var(--border);background:rgba(255,255,255,.03);
    cursor:pointer;font-size:11.5px;color:var(--text-dim);transition:all .18s var(--curve)}
  .g-base::before{content:'';flex:0 0 auto;width:11px;height:11px;border-radius:50%;
    border:1.5px solid var(--border-hi);transition:all .18s var(--curve)}
  .g-base:hover{background:var(--panel-hover);color:var(--text)}
  .g-base.on{border-color:var(--accent);color:var(--accent);background:rgba(34,211,238,.10)}
  .g-base.on::before{border-color:var(--accent);background:var(--accent);
    box-shadow:0 0 0 2px rgba(34,211,238,.22)}
  .g-base-t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .g-desc{font-size:11px;color:#b6b6c2;line-height:1.45;margin-top:6px;min-height:15px}
  .param-head{font-size:11px;letter-spacing:1px;color:var(--text);
    text-transform:uppercase;font-weight:600;opacity:.92;margin:14px 0 8px}
  .param-head:first-child{margin-top:0}
  .note{background:#1b1b21;border:1px solid var(--border);border-radius:9px;
        padding:12px 14px;font-size:12px;color:var(--text-dim);line-height:1.7}
  .note b{color:var(--text)}
  .row{display:flex;gap:22px;flex-wrap:wrap;align-items:flex-start}
  .big .fi{width:96px;height:96px}
  .big{display:flex;gap:14px;flex-wrap:wrap}
  .bigitem{text-align:center;font-size:11px;color:var(--text-dim)}
</style>
</head>
<body>
<h1>胶片卷图标 · 预览</h1>
<div class="sub">形状用你给的胶卷 SVG，颜色是每卷的代表色。左：大图看质感　右：实际尺寸（右栏里就这么大）</div>

<h2>大图（96px）</h2>
<div class="big" id="bigRow"></div>

<h2>右栏实际大小（40px，就是你在调色台看到的样子）</h2>
<div class="row">
  <div class="pane">
    <div class="param-head">胶片卷</div>
    <div class="g-stocks" id="grid"></div>
    <div class="g-desc" id="desc"></div>
    <div class="param-head">成色基准</div>
    <div class="g-bases" id="bases"></div>
    <div class="g-desc">追黄 + 彩度微调 + 反差微调（09-14 由当前基线重解）—— 颜色三块进来之后重跑</div>
  </div>
  <div class="note" style="flex:1;min-width:280px">
    <b>看什么</b><br>
    ① 5 个卷是不是<b>一眼分得出</b>（不靠看字）<br>
    ② 颜色对不对得上你对这个卷的印象<br>
    ③ 缩到 40px 齿孔糊不糊<br>
    ④ 选中那个的高亮（点一下试试）
  </div>
</div>

<script>
const STOCK_COLORS = {
  neutral:   { a:'#4b5563', b:'#374151', t:'中性' },
  portra400: { a:'#e8a87c', b:'#c9764a', t:'Portra 400' },
  fuji_c200: { a:'#8fc9a8', b:'#4f9c74', t:'C200' },
  pro400h:   { a:'#a8c8b8', b:'#5f8f7a', t:'Pro 400H' },
  ektar100:  { a:'#d98878', b:'#b04a42', t:'Ektar 100' },
  cinestill800t:{ a:'#d9a066', b:'#a86a2c', t:'500T' }
};
const D = 'M895.8 98.2c0.2 0.9 0.3 1.8 0.3 2.8v78.8c0 6.6-5.4 12-12 12h-40c-6.6 0-12-5.4-12-12V101c0-1 0.1-1.9 0.3-2.8H191.7c0.2 0.9 0.3 1.8 0.3 2.8v78.8c0 6.6-5.4 12-12 12h-40c-6.6 0-12-5.4-12-12V101c0-1 0.1-1.9 0.3-2.8H65v830h64.5c-0.9-1.7-1.5-3.6-1.5-5.7v-78.8c0-6.6 5.4-12 12-12h40c6.6 0 12 5.4 12 12v78.8c0 2.1-0.5 4-1.5 5.7h643c-0.9-1.7-1.5-3.6-1.5-5.7v-78.8c0-6.6 5.4-12 12-12h40c6.6 0 12 5.4 12 12v78.8c0 2.1-0.5 4-1.5 5.7h66.2v-830h-64.9zM192.2 755.8c0 6.6-5.4 12-12 12h-40c-6.6 0-12-5.4-12-12v-58.4c0-6.6 5.4-12 12-12h40c6.6 0 12 5.4 12 12v58.4z m0-143.2c0 6.6-5.4 12-12 12h-40c-6.6 0-12-5.4-12-12v-58.4c0-6.6 5.4-12 12-12h40c6.6 0 12 5.4 12 12v58.4z m0-143.1c0 6.6-5.4 12-12 12h-40c-6.6 0-12-5.4-12-12v-58.4c0-6.6 5.4-12 12-12h40c6.6 0 12 5.4 12 12v58.4z m0-143.2c0 6.6-5.4 12-12 12h-40c-6.6 0-12-5.4-12-12V268c0-6.6 5.4-12 12-12h40c6.6 0 12 5.4 12 12v58.3z m703.9 429.5c0 6.6-5.4 12-12 12h-40c-6.6 0-12-5.4-12-12v-58.4c0-6.6 5.4-12 12-12h40c6.6 0 12 5.4 12 12v58.4z m0-143.2c0 6.6-5.4 12-12 12h-40c-6.6 0-12-5.4-12-12v-58.4c0-6.6 5.4-12 12-12h40c6.6 0 12 5.4 12 12v58.4z m0-143.1c0 6.6-5.4 12-12 12h-40c-6.6 0-12-5.4-12-12v-58.4c0-6.6 5.4-12 12-12h40c6.6 0 12 5.4 12 12v58.4z m0-143.2c0 6.6-5.4 12-12 12h-40c-6.6 0-12-5.4-12-12V268c0-6.6 5.4-12 12-12h40c6.6 0 12 5.4 12 12v58.3z';
const D2 = 'M756.2 448.2H268.1c-6.6 0-12-5.4-12-12V203.8c0-6.6 5.4-12 12-12h488.1c6.6 0 12 5.4 12 12v232.4c0 6.6-5.4 12-12 12z';
const D3 = 'M756 831.7H267.9c-6.6 0-12-5.4-12-12V587.3c0-6.6 5.4-12 12-12H756c6.6 0 12 5.4 12 12v232.4c0 6.6-5.4 12-12 12z';

function filmIcon(name, size){
  const c = STOCK_COLORS[name] || STOCK_COLORS.neutral;
  const s = size || 44;
  const perf = name==='neutral' ? '#6E6E6E' : c.b;
  const p2   = name==='neutral' ? '#8C8C8C' : c.a;
  return '<svg viewBox="0 0 1024 1024" width="'+s+'" height="'+s+'" class="fi">'
    + '<path fill="'+perf+'" d="'+D+'"/>'
    + '<path fill="'+p2+'" d="'+D2+'"/>'
    + '<path fill="'+c.a+'" d="'+D3+'"/></svg>';
}

const STOCKS = [
  {name:'neutral',      label:'中性基准',  desc:'不风格化，原样放行（做 A/B 对照用）'},
  {name:'portra400',    label:'柯达 Portra 400', desc:'真卷：Kodak Portra 400 负片 + Portra Endura 相纸'},
  {name:'fuji_c200',    label:'富士 C200',  desc:'真卷：Fujifilm C200 + Crystal Archive Type II'},
  {name:'pro400h',      label:'富士 Pro 400H', desc:'真卷：Fujifilm Pro 400H + Crystal Archive Type II'},
  {name:'ektar100',     label:'柯达 Ektar 100', desc:'真卷：Kodak Ektar 100 + Endura Premier'},
  {name:'cinestill800t',label:'电影卷 800T', desc:'真卷：Kodak Vision3 500T + 2383 印片（Cinestill 800T 就是它去碳层）'}
];
const SHORT = n => (STOCK_COLORS[n] && STOCK_COLORS[n].t) || n;
let cur = 'portra400';

function paint(){
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  for (const s of STOCKS){
    const d = document.createElement('div');
    d.className = 'g-stock' + (cur===s.name?' on':'');
    d.title = s.label + '\n' + s.desc;
    d.innerHTML = filmIcon(s.name, 40) + '<div class="g-stock-name">'+SHORT(s.name)+'</div>';
    d.onclick = () => { cur = s.name; paint(); };
    grid.appendChild(d);
  }
  const s = STOCKS.find(x=>x.name===cur);
  document.getElementById('desc').textContent = s.desc;
  // 基准
  const bs = document.getElementById('bases');
  if (bs && !bs.dataset.done){
    bs.dataset.done = '1';
    [['① 全对齐（推荐）'],['② 只对齐色相'],['③ 不对齐']].forEach((x,i)=>{
      const d = document.createElement('div');
      d.className = 'g-base' + (i===0?' on':'');
      d.innerHTML = '<span class="g-base-t">'+x[0]+'</span>';
      d.onclick = () => { bs.querySelectorAll('.g-base').forEach(e=>e.classList.remove('on')); d.classList.add('on'); };
      bs.appendChild(d);
    });
  }
  // 大图
  const big = document.getElementById('bigRow');
  big.innerHTML = '';
  for (const s of STOCKS){
    const w = document.createElement('div');
    w.className = 'bigitem';
    w.innerHTML = filmIcon(s.name, 96) + '<div style="margin-top:6px">'+SHORT(s.name)+'</div>';
    big.appendChild(w);
  }
}
paint();
</script>
</body>
</html>
